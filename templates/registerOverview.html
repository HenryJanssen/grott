{% extends "base.html" %}

{% block metatags %}
<title>Grott - Register Overview</title>
<meta name="description" content="Register Overview">
{% endblock %}

{% block contents %}
<div class="container-fluid" style="padding: 20px;">
    <h1 style="margin-bottom: 18px;">Register Overview</h1>

    <div class="row mb-3">
        <div class="col-md-6">
            <input id="globalSearch" class="form-control" placeholder="Search registers...">
        </div>
        <div class="col-md-3">
            <select id="pageSize" class="form-control">
                <option value="10">10 per page</option>
                <option value="25" selected>25 per page</option>
                <option value="50">50 per page</option>
                <option value="100">100 per page</option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="filterIdType" class="form-control">
                <option value="">All Types</option>
                <option value="Datalogger">Datalogger</option>
                <option value="Inverter">Inverter</option>
            </select>
        </div>
    </div>

    <div id="grid-wrapper"></div>
</div>

<!-- Grid.js CSS/JS -->
<link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
<script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>

<script>
    (function(){
        const gridContainer = document.getElementById('grid-wrapper');
        const pageSize = 25;
        let currentPageSize = pageSize;

        // helper to build server URL with params
        function buildUrl(page, perPage, search, sortBy, sortDir, filterIdType) {
            const params = new URLSearchParams();
            params.set('page', page);
            params.set('perPage', perPage);
            if (search) params.set('search', search);
            if (sortBy) params.set('sortBy', sortBy);
            if (sortDir) params.set('sortDir', sortDir);
            if (filterIdType) params.set('filterIdType', filterIdType);
            return '/api/registers?' + params.toString();
        }

        // format timestamp in table cell
        function formatDate(ts) {
            if (!ts) return '';
            return ts; // API now returns retrievalDateFmt, already formatted
        }

        // instantiate grid with server mode
        let grid = new gridjs.Grid({
            columns: [
                { id: 'idType', name: 'ID Type' },
                { id: 'id', name: 'ID' },
                { id: 'regno', name: 'Register' },
                { id: 'name', name: 'Name' },
                { id: 'description', name: 'Description' },
                { id: 'unit', name: 'Unit' },
                { id: 'value', name: 'Value' },
                { id: 'retrievalDateFmt', name: 'Retrieval Date' }
            ],
            server: {
                url: buildUrl(1, currentPageSize, '', 'id', 'asc', ''),
                then: data => data.data.map(r => [r.idType, r.id, r.regno, r.name || '-', r.description || '-', r.unit || '-', r.value, r.retrievalDateFmt]),
                total: data => data.total
            },
            pagination: {
                enabled: true,
                limit: currentPageSize
            },
            sort: true,
            resizable: true,
            style: {
                table: {
                    'white-space': 'nowrap'
                }
            }
        }).render(gridContainer);

        // handle global search
        const searchInput = document.getElementById('globalSearch');
        let searchTimeout = null;
        searchInput.addEventListener('input', function(e){
            clearTimeout(searchTimeout);
            const q = e.target.value.trim();
            const filter = document.getElementById('filterIdType').value;
            searchTimeout = setTimeout(()=>{
                grid.updateConfig({
                    server: {
                        url: buildUrl(1, currentPageSize, q, 'id', 'asc', filter),
                        then: data => data.data.map(r => [r.idType, r.id, r.regno, r.name || '-', r.description || '-', r.unit || '-', r.value, r.retrievalDateFmt]),
                        total: data => data.total
                    }
                }).forceRender();
            }, 300);
        });

        // handle page size change
        const pageSizeSelect = document.getElementById('pageSize');
        pageSizeSelect.addEventListener('change', function(e){
            currentPageSize = parseInt(e.target.value);
            const q = searchInput.value.trim();
            const filter = document.getElementById('filterIdType').value;
            grid.updateConfig({
                pagination: {
                    enabled: true,
                    limit: currentPageSize
                },
                server: {
                    url: buildUrl(1, currentPageSize, q, 'id', 'asc', filter),
                    then: data => data.data.map(r => [r.idType, r.id, r.regno, r.name || '-', r.description || '-', r.unit || '-', r.value, r.retrievalDateFmt]),
                    total: data => data.total
                }
            }).forceRender();
        });

        // handle column filter (idType)
        const filterSelect = document.getElementById('filterIdType');
        filterSelect.addEventListener('change', function(e){
            const filter = e.target.value;
            const q = searchInput.value.trim();
            grid.updateConfig({
                server: {
                    url: buildUrl(1, currentPageSize, q, 'id', 'asc', filter),
                    then: data => data.data.map(r => [r.idType, r.id, r.regno, r.name || '-', r.description || '-', r.unit || '-', r.value, r.retrievalDateFmt]),
                    total: data => data.total
                }
            }).forceRender();
        });

        // listen for grid sort events to update server request
        // Grid.js doesn't emit sort events directly in server mode, but we can override the update function
        // For now, basic sorting is handled by Grid.js client-side via sort icons
    })();
</script>

{% endblock %}
