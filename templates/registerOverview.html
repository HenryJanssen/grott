{% extends "base.html" %}

{% block metatags %}
<title>Grott - Register Overview</title>
<meta name="description" content="Register Overview">
{% endblock %}

{% block contents %}
    <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>

    <body>
      <h1>Register Overview</h1>
      <div id="registers-table"></div>
      <script>
        new gridjs.Grid({
          columns: [
            { id: "idType", name: "Datalogger/Inverter" },
            { id: "id", name: "Datalogger/Inverter ID" },
            { id: "regno", name: "Register No" },
            { id: "name", name: "Name" },
            { id: "value", name: "Value" },
            { id: "unit", name: "Unit" },
            { id: "description", name: "Description" }
          ],
          server: {
            url: "/api/registers",
            then: data => data.data.map(reg => [
                reg.idType,
                reg.id,
                reg.regno,
                reg.name || "(no name)",
                reg.value || "(empty)",
                reg.unit || "",
                reg.description || ""
            ])
          },
          search: true,
          pagination: { enabled: true, limit: 25 },
          sort: true
        }).render(document.getElementById("registers-table"));
      </script>
    </body>
{% endblock %}
